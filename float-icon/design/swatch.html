<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:#0e1014;font:12px -apple-system,"PingFang SC",sans-serif;color:#8b90a0}
.row{display:flex;gap:12px;margin-bottom:14px}
.box{width:150px;height:70px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.dark{background:#1b1e26}.light{background:#f7f8fa}.mid{background:#8a8f9c}
.pill{font-family:"SF Mono",ui-monospace,monospace;font-size:9.5px;font-weight:600;color:rgba(255,255,255,.95);
      padding:3px 8px;border-radius:8px;border:.5px solid rgba(255,255,255,.14);font-variant-numeric:tabular-nums}
.a{background:rgba(0,0,0,.34)}.b{background:rgba(0,0,0,.55)}.c{background:rgba(0,0,0,.72)}
.lbl{font-size:10px;margin-bottom:6px}
</style></head><body>
<div class="lbl">34% / 55% / 72% 黑底，三种背景：深、中灰、浅</div>
<div class="row">
  <div class="box dark"><span class="pill a">680.2M</span></div>
  <div class="box dark"><span class="pill b">680.2M</span></div>
  <div class="box dark"><span class="pill c">680.2M</span></div>
</div>
<div class="row">
  <div class="box mid"><span class="pill a">680.2M</span></div>
  <div class="box mid"><span class="pill b">680.2M</span></div>
  <div class="box mid"><span class="pill c">680.2M</span></div>
</div>
<div class="row">
  <div class="box light"><span class="pill a">680.2M</span></div>
  <div class="box light"><span class="pill b">680.2M</span></div>
  <div class="box light"><span class="pill c">680.2M</span></div>
</div>
</body></html>
